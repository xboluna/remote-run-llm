[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-run-llm"
version = "0.1.0"
description = "Run SSH commands and copy files from Python — one function, no Paramiko boilerplate."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xavier Boluna", email = "xboluna@users.noreply.github.com" }]
keywords = [
    "ssh",
    "remote",
    "paramiko",
    "sftp",
    "remote-command",
    "run-command-on-server",
    "upload-file-ssh",
    "download-file-ssh",
    "without-fabric",
    "simple-ssh",
    "llm-friendly",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "paramiko>=3.4,<5",
]

[project.urls]
Homepage = "https://github.com/xboluna/remote-run-llm"
Documentation = "https://xboluna.github.io/remote-run-llm/"
Repository = "https://github.com/xboluna/remote-run-llm"
Changelog = "https://github.com/xboluna/remote-run-llm/blob/main/CHANGELOG.md"
Issues = "https://github.com/xboluna/remote-run-llm/issues"
Blog = "https://xboluna.com/blog"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_run"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/RECIPES.md",
    "/llms.txt",
    "/llms-full.txt",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]
test = ["pytest>=8", "pytest-cov>=6"]
lint = ["ruff>=0.9"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
